# Déploiement automatique du site sur GitHub Pages
#
# À chaque envoi (push) sur la branche main, ce workflow publie
# automatiquement le contenu du dépôt sur GitHub Pages, sans passer
# par l'upload manuel via le site web de GitHub.
#
# Prérequis : dans Settings > Pages > Build and deployment > Source,
# choisir "GitHub Actions" (au lieu de "Deploy from a branch").

name: Déployer le site sur GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

