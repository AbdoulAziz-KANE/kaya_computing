# Vérifications qualité + déploiement automatique sur GitHub Pages
#
# Fonctionnement recommandé :
#   1. Vous travaillez sur la branche "develop" (jamais directement sur main).
#   2. Quand vous poussez sur "develop" ou ouvrez une Pull Request vers
#      "main", le job "quality" valide le HTML et vérifie les liens —
#      sans jamais publier le site.
#   3. Une fois la Pull Request fusionnée (merge) dans "main", le job
#      "deploy" publie automatiquement le site sur GitHub Pages.
#
# Résultat : le site en ligne n'est jamais modifié tant que les
# vérifications n'ont pas été validées ET que le code n'est pas sur main.
#
# Prérequis : dans Settings > Pages > Build and deployment > Source,
# choisir "GitHub Actions" (au lieu de "Deploy from a branch").

name: Vérifications et déploiement

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    name: Vérifications qualité
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Valider le HTML
        run: |
          pip install html5validator
          html5validator --root .

      - name: Vérifier les liens du site
        uses: lycheeverse/lychee-action@v2
        with:
          # WhatsApp, Instagram, TikTok et X bloquent souvent les robots
          # (erreur 403) sans que le lien soit réellement cassé : on les
          # exclut pour éviter les faux échecs.
          args: >-
            --no-progress
            --exclude-mail
            --exclude "^https://(www\.)?(instagram|tiktok|x)\.com"
            --exclude "^https://wa\.me"
            "./**/*.html"
          fail: true

  deploy:
    name: Déploiement
    needs: quality
    # Ne publie que sur un push réel vers main — jamais depuis une
    # Pull Request ou un push sur develop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
